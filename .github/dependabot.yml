version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  # Maintain Dart / Flutter dependencies in root package
  - package-ecosystem: 'pub'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  # Maintain Dart / Flutter dependencies in example application
  - package-ecosystem: 'pub'
    directory: '/example'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
