name: flutter_notification_flow
description: A provider-independent Flutter package for normalizing and reliably routing notification interactions across different notification sources and application states.
version: 0.1.0
homepage: https://github.com/sapanlabs/flutter_notification_flow
repository: https://github.com/sapanlabs/flutter_notification_flow
issue_tracker: https://github.com/sapanlabs/flutter_notification_flow/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=3.0.0 <7.0.0"

topics:
  - flutter
  - notifications
  - navigation
  - routing
  - push-notifications
